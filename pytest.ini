[pytest]
testpaths = tests
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    benchmarks
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    --durations=10
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    mcp: MCP server related tests
    embeddings: Embedding generation tests
    chunking: Code chunking tests
    search: Search functionality tests
    asyncio: Async tests managed by pytest-asyncio
filterwarnings =
    ignore:.*SwigPy.*:DeprecationWarning
    ignore:.*builtin type.*has no __module__ attribute:DeprecationWarning
