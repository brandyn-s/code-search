[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-search-mcp"
version = "0.4.0"
description = "Hybrid semantic + keyword code search MCP server. FAISS vector + FTS5 BM25 with Voyage AI, Jina, or local embeddings."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
authors = [
    { name = "The code-search contributors" }
]
keywords = [
    "semantic-search",
    "code-search",
    "embeddings",
    "faiss",
    "mcp",
    "claude",
    "tree-sitter",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # anthropic 1.0.0 is a declared breaking major; see requirements.txt for the
    # measured resolve and the condition for lifting this bound.
    "anthropic>=0.40.0,<1.0.0",
    "click>=8.2.1",
    "faiss-cpu>=1.12.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.34.4",
    # mcp 2.x API (MCPServer). 3.x is a future breaking major.
    "mcp>=2,<3",
    "numpy",
    "PyYAML>=6.0",
    "rich>=14.1.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-c>=0.24.1",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-markdown>=0.3.2",
    "tree-sitter-nix>=0.1.0",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-svelte>=1.0.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
# Local (offline) embeddings and the cross-encoder reranker. Pulls PyTorch.
local = [
    "sentence-transformers>=5.1.0",
]
dev = [
    "sentence-transformers>=5.1.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "hypothesis>=6.100",
]

[project.scripts]
code-search-mcp = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/brandyn-s/code-search"
Repository = "https://github.com/brandyn-s/code-search"
Issues = "https://github.com/brandyn-s/code-search/issues"
Changelog = "https://github.com/brandyn-s/code-search/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["common_utils"]

[tool.setuptools.packages.find]
include = ["mcp_server*", "embeddings*", "chunking*", "search*", "merkle*"]

[tool.setuptools.package-data]
"mcp_server" = ["*.yaml"]
"chunking" = ["*.yaml"]
"search" = ["profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bench/eval/fixtures"]

[tool.ruff.lint]
# Correctness-only baseline; the codebase predates ruff and is not formatted with it.
select = ["E9", "E722", "F63", "F7", "F82", "F401", "F811", "B006", "B008", "B905"]
