[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redacted-code-search"
version = "0.2.0"
description = "Hybrid semantic + keyword code search MCP server. FAISS vector + FTS5 BM25 with Voyage AI, Jina, or local embeddings."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "redacted Security" }
]
keywords = [
    "semantic-search",
    "code-search",
    "embeddings",
    "faiss",
    "mcp",
    "claude",
    "tree-sitter",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.2.1",
    "faiss-cpu>=1.12.0",
    "httpx>=0.27.0",
    "fastmcp>=2.12.2",
    "huggingface-hub>=0.34.4",
    "mcp>=1.13.1",
    "numpy",
    "rich>=14.1.0",
    "sentence-transformers>=5.1.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-c>=0.24.1",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-markdown>=0.3.2",
    "tree-sitter-nix>=0.1.0",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-svelte>=1.0.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[project.scripts]
code-search-mcp = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/redacted-org/code-search"
Repository = "https://github.com/redacted-org/code-search"

[tool.setuptools]
py-modules = ["common_utils"]

[tool.setuptools.packages.find]
include = ["mcp_server*", "embeddings*", "chunking*", "search*", "merkle*"]

[tool.setuptools.package-data]
"mcp_server" = ["*.yaml"]
"chunking" = ["*.yaml"]
