tools:
  search_code: |
    Search indexed code with a natural-language query. Returns ranked JSON with paths, line ranges, chunk types, scores, and snippets. `k` is 1-100; `search_mode` is `auto`, `hybrid`, `keyword`, or `semantic`. `file_pattern` is a glob; `chunk_type` is an exact match. Auto-reindexes stale projects (default 5min). For structural queries such as call graphs or blast radius, use codebase-memory-mcp instead.

  index_directory: |
    Start indexing a codebase in the background. Returns job_id, status, and index_ready=false. Parses source into AST chunks, generates embeddings, and stores FAISS/SQLite artifacts. Captures source identity before and after indexing; a mid-run source change fails instead of publishing a ready generation. Poll with get_indexing_progress. Supports incremental Merkle change detection.

  get_indexing_progress: |
    Check the progress of a running index_directory operation. Returns JSON with job_id, status (indexing/completed/failed/cancelled/idle), index_ready, current phase (chunking/embedding/saving/done), chunks_done, chunks_total, and percent complete. Call after index_directory returns a job_id. Terminal results include index_identity_status and the identity envelope when ready. Poll every 15-30 seconds for updates.

  find_similar_code: |
    Locate code chunks functionally similar to a reference chunk by embedding distance. Takes a chunk_id from a previous search_code result and returns the k nearest neighbors. Each result includes file path, line range, chunk type, name, similarity score, content preview, and semantic tags. Returns JSON with reference chunk ID and similar_chunks array. Useful for detecting duplication, finding alternative implementations, or identifying refactoring candidates.

  get_index_status: |
    Return index readiness, job state, embedding statistics, storage target, and source/index identities. Pass optional project_path to inspect a repository before switch_project without changing the active project or caches. Resolves the matching foreground job and existing provider-aware storage without creating or migrating project data. index_ready is true only when the stored generation and live source identity match; omit project_path to inspect the active or auto-detected project.

  list_projects: |
    Returns all previously indexed projects with their metadata and index statistics as a JSON array. Each project entry includes name, filesystem path, content hash, creation timestamp, and index stats (chunk count, file count) when available. Also reports which project is currently active via current_project field. Typically returns under 20 entries. Use switch_project to change the active project context before running searches against a different codebase.

  switch_project: |
    Change the active project context for subsequent search and similarity operations. Resolves the given filesystem path, verifies it has been previously indexed (FAISS index file must exist), and resets the internal index manager and searcher to load the target project's data. Returns JSON with success status and project metadata (name, path, hash, creation date). If the project has not been indexed, returns an error with a suggestion to run index_directory first. No data is modified on disk.

  index_test_project: |
    Index the built-in sample Python project for testing and demonstration purposes. The sample project includes authentication (login, password hashing), database (connections, queries), API handlers (HTTP, validation), and utility modules. Returns the standard indexing result JSON (file/chunk counts, timing) plus a demo_info block with project description and sample search queries to try. Useful for verifying the server works before indexing your own codebase.

  clear_index: |
    Permanently delete the FAISS vector index and SQLite metadata for the currently active project. This is irreversible - all indexed chunks, embeddings, and file metadata are destroyed. Re-run index_directory to rebuild after clearing. Only affects the current project; other projects are untouched. Returns JSON with success status. Fails if no project is currently active. Use list_projects to check which project is active before clearing.

  delete_project: |
    Permanently delete a project and all its associated data (FAISS index, SQLite metadata, embeddings, Merkle snapshots, and project_info.json). Accepts a project_name string matching either the directory prefix or the project_name field in project_info.json. Resets server state if the deleted project is currently active. Returns JSON with success status, deleted_project name, and a confirmation message. Not reversible - re-run index_directory to recreate. Use list_projects to see available project names.

  search_all_projects: |
    Search up to 25 isolated project indexes without changing the active project. Returns project-tagged grouped results plus a project-balanced global ranking; scores built in different indexes are explicitly not treated as comparable. Takes query, k per project (1-20), optional canonical project index IDs, and top_k (1-100). Discovery only: verify claims with project-bound evidence tools.

  cancel_indexing: |
    Request cancellation of the currently running index_directory background job. The job stops at the next progress checkpoint (between chunk batches), so cancellation is not instant. Returns JSON with success status and job_id. If no indexing job is active, returns an error. After cancellation, the index may be partially built - run index_directory again for a complete index.

  verify_index_integrity: |
    Verify per-project consistency between the canonical chunk_ids.pkl and the dependent artifacts (fts5.db, metadata.db, stats.json) for every indexed project (or one project if `project` prefix is given). Treats chunk_ids.pkl as the single source of truth — surfaces fts5 orphans, metadata orphans, and stats.json drift as actionable counts. Returns JSON with per-project entries (status: clean | inconsistent | unscannable) and a summary block. When inconsistencies exist, the response includes a `remediation` field pointing at `scripts/cleanup_index_orphans.py --apply-all` (run with the MCP server quiesced). Read-only — never modifies state.

  get_file_context: |
    Returns the chunks code-search has indexed for a specific file (and optionally a line-range window). Bridges from "I'm reading this file" to "what does code-search have indexed for this region" without forcing a search query. Takes file_path (string, matched as exact or suffix against relative_path), optional line_range string in "start-end" format, and optional max_chunks (default 20). Returns JSON with matched_path, total_chunks_in_file, and a sorted chunks array (chunk_id, start_line, end_line, chunk_type, name, parent_name, tags, content_preview). Useful for inspecting what is indexed for a specific file without running a search, triaging "what was indexed here when this file changed", and debugging "why didn't this chunk surface for this query". Read-only.

  code_localize: |
    Aggregates chunk-level search_code results into a file-level ranking. Best for VERBOSE natural-language issues where the consumer needs file paths, not chunks (e.g. "where would I add support for X?", "what files implement Y?"). Takes query (string), k (top files to return, default 10), max_chunks_per_search (internal chunk pool, default 50), and search_mode (passed through to search_code, default "auto"). Each file's score combines max chunk similarity (0.6 weight), log-scaled chunk count (0.3), and chunk-type diversity (0.1). Returns JSON with files array (file_path, score, max_similarity, chunk_count, chunk_types, top_chunks) plus the underlying search_code _metadata envelope. Wraps search_code so auto-reindex / reranker / freshness behavior is identical. Read-only.

help: |
  # Find similar code

  1. Index a codebase: `index_directory("/path/to/project")`
  2. Search: `search_code("description of code you want")`
  3. Find similar: `find_similar_code(chunk_id from search_code)`

  See tool descriptions for details and available options.
