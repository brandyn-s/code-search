name: external-benchmarks

# Manually dispatched. Evaluates code-search on a public code-retrieval
# benchmark (CoIR, BEIR format) so the embedding-provider choice has a
# DEFENSIBLE EXTERNAL number, not just the internal golden MRR — which may be
# label-biased (docs/findings/2026-05-24-r9-extension-session-synthesis.md) and
# is not comparable to any leaderboard (docs/EXTERNAL_BENCHMARKS.md). Runs
# voyage-4-large vs voyage-code-3 head-to-head.
#
# Needs the VOYAGE_API_KEY repo secret and fails before evaluation when it is
# unavailable. CoIR data is pulled from the HF datasets-server (no key).

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'CoIR HF dataset id'
        required: false
        default: 'CoIR-Retrieval/cosqa'
      max_queries:
        description: 'Max queries to evaluate'
        required: false
        default: '200'

permissions:
  contents: read

jobs:
  external-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyarrow==25.0.0

      - name: Adapt CoIR task (no key needed)
        env:
          DATASET: ${{ github.event.inputs.dataset }}
          MAX_QUERIES: ${{ github.event.inputs.max_queries }}
        run: |
          python bench/research/coir_adapter.py \
            --dataset "$DATASET" \
            --split test \
            --max-queries "$MAX_QUERIES" \
            --out "$RUNNER_TEMP/coir_task"

      - name: Check VOYAGE_API_KEY
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          if [ -z "$VOYAGE_API_KEY" ]; then
            echo "::error::VOYAGE_API_KEY is required for external evaluation."
            exit 1
          fi

      - name: Seal adapted corpus source identity
        run: |
          CORPUS="$RUNNER_TEMP/coir_task/corpus"
          git -C "$CORPUS" init --quiet
          git -C "$CORPUS" config user.name "Code Search Benchmark"
          git -C "$CORPUS" config user.email "benchmark@invalid.example"
          git -C "$CORPUS" add --all
          GIT_AUTHOR_DATE="2026-01-01T00:00:00Z" \
          GIT_COMMITTER_DATE="2026-01-01T00:00:00Z" \
            git -C "$CORPUS" commit --quiet \
              -m "Seal adapted CoIR corpus"
          SOURCE_REVISION="$(git -C "$CORPUS" rev-parse HEAD)"
          test -n "$SOURCE_REVISION"
          test -z "$(git -C "$CORPUS" status --porcelain)"

      - name: Eval voyage-4-large vs voyage-code-3 (rerank off)
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          CORPUS="$RUNNER_TEMP/coir_task/corpus"
          GOLDEN="$RUNNER_TEMP/coir_task/golden.json"
          QRELS="$RUNNER_TEMP/coir_task/qrels_graded.json"
          for M in voyage-4-large voyage-code-3; do
            echo "=== $M ==="
            CFG="{\"name\":\"$M\",\"provider\":\"voyage\",\"model\":\"$M\",\"use_input_type\":true,\"use_reranker\":false,\"needs_reindex\":true}"
            EMBEDDING_PROVIDER=voyage EMBEDDING_MODEL="$M" VOYAGE_INPUT_TYPE=on RERANKER=off USE_VOYAGE_RERANKER=off \
              python benchmarks/_eval_worker.py "$CFG" "$CORPUS" "$GOLDEN" "$RUNNER_TEMP/idx_$M" \
              --k 10 \
              --qrels "$QRELS" \
              --output "$RUNNER_TEMP/results_$M.json" \
              --unique-documents \
              | tee "$RUNNER_TEMP/metrics_$M.txt"
          done

      - name: Validate benchmark outputs
        run: |
          for M in voyage-4-large voyage-code-3; do
            test -s "$RUNNER_TEMP/metrics_$M.txt"
            test -s "$RUNNER_TEMP/results_$M.json"
          done
          python bench/research/validate_external_benchmark.py \
            --golden "$RUNNER_TEMP/coir_task/golden.json" \
            --qrels "$RUNNER_TEMP/coir_task/qrels_graded.json" \
            --results-dir "$RUNNER_TEMP"

      - name: Upload metrics and ranked runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coir-metrics
          path: |
            ${{ runner.temp }}/metrics_*.txt
            ${{ runner.temp }}/results_*.json
            ${{ runner.temp }}/coir_task/golden.json
            ${{ runner.temp }}/coir_task/qrels_graded.json
          if-no-files-found: error
