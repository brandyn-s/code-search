name: PR Security Review (Required)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # ── Housekeeping ──────────────────────────────────────────────
  remove-approval-on-push:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove security-approved label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels/security-approved" \
            -X DELETE 2>/dev/null || true

  # ── Parallel scanners ─────────────────────────────────────────
  # All scanner jobs run concurrently for maximum speed.

  gitleaks:
    uses: redacted-org/.github/.github/workflows/gitleaks.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  opengrep:
    uses: redacted-org/.github/.github/workflows/opengrep.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  trivy:
    uses: redacted-org/.github/.github/workflows/trivy.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  checkov:
    uses: redacted-org/.github/.github/workflows/checkov.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  dependency-immutability:
    uses: redacted-org/.github/.github/workflows/dependency-immutability.yml@main
    permissions:
      contents: read
      pull-requests: write

  # Tier 1: Fast OpenGrep AI rules scan (~10s, zero API cost)
  # Runs custom AI best-practices rules and posts inline review comments.
  fast-ai-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run AI security scan
        uses: redacted-org/pr-security-review/fast-gate@3286d7660757f0fd112287078f846a3dca96078f # v0.7.2

  # ── Attestation verification ──────────────────────────────────
  # Verifies that the developer ran /redacted-org-gate locally before pushing.
  # Replaces the heavy Claude API deep review (~60s) with fast verification (~5s).
  verify-attestation:
    uses: redacted-org/.github/.github/workflows/verify-attestation.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets:
      SECURITY_ATTESTATION_KEY: ${{ secrets.SECURITY_ATTESTATION_KEY }}

  # ── Auto-merge gate ──────────────────────────────────────────
  # Reads .github/repo-security-policy.yml to determine tier and merge behavior.
  # Tier 1: requires CODEOWNERS approval. Tier 2: auto-merge after approval.
  # Tier 3: auto-merge immediately if all checks pass.
  auto-merge:
    needs: [verify-attestation, fast-ai-scan]
    if: github.event.pull_request.head.repo.fork == false && needs.fast-ai-scan.result == 'success'
    uses: redacted-org/.github/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      attestation-valid: ${{ needs.verify-attestation.outputs.valid == 'true' }}
      fast-gate-passed: ${{ needs.fast-ai-scan.result == 'success' }}
