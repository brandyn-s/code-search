name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Project version to release (without the v prefix)
        required: true
        default: "0.2.1"

concurrency:
  group: code-search-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      wheel_name: ${{ steps.artifact.outputs.wheel_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Validate release target and successful main CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$VERSION" = "$PROJECT_VERSION"
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

          UNIT_RUN_URL="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/unit-tests.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0].html_url // ""'
          )"
          if [ -z "$UNIT_RUN_URL" ]; then
            echo "No successful Unit Tests push run found for $GITHUB_SHA" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated Unit Tests run: $UNIT_RUN_URL"

      - name: Install build and acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt wheel

      - name: Build and validate the exact wheel
        id: artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          python -m pip wheel \
            --no-deps \
            --no-build-isolation \
            --wheel-dir dist \
            .
          WHEEL_NAME="redacted_code_search-${VERSION}-py3-none-any.whl"
          test -f "dist/$WHEEL_NAME"
          python tests/acceptance/wheel_contract.py --wheel "dist/$WHEEL_NAME"
          (
            cd dist
            sha256sum "$WHEEL_NAME" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "wheel_name=$WHEEL_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload validated release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ steps.release.outputs.version }}
          path: |
            dist/${{ steps.artifact.outputs.wheel_name }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  attest:
    needs: preflight-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      bundle_name: ${{ steps.bundle.outputs.bundle_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download validated release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-${{ needs.preflight-build.outputs.version }}
          path: dist

      - name: Recheck downloaded bytes
        env:
          WHEEL_NAME: ${{ needs.preflight-build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          test -f "dist/$WHEEL_NAME"
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Attest release inputs
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/${{ needs.preflight-build.outputs.wheel_name }}
            dist/SHA256SUMS

      - name: Preserve and verify the signed provenance bundle
        id: bundle
        env:
          BUNDLE_SOURCE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ needs.preflight-build.outputs.version }}
          WHEEL_NAME: ${{ needs.preflight-build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          WHEEL="dist/$WHEEL_NAME"
          BUNDLE_NAME="redacted_code_search-${VERSION}-provenance.jsonl"
          BUNDLE="dist/$BUNDLE_NAME"
          cp "$BUNDLE_SOURCE" "$BUNDLE"
          test -s "$BUNDLE"
          gh attestation verify "$WHEEL" \
            --bundle "$BUNDLE" \
            --deny-self-hosted-runners \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA"
          echo "bundle_name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload attested release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-release-${{ needs.preflight-build.outputs.version }}
          path: |
            dist/${{ needs.preflight-build.outputs.wheel_name }}
            dist/SHA256SUMS
            dist/${{ steps.bundle.outputs.bundle_name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs:
      - preflight-build
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download attested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-release-${{ needs.preflight-build.outputs.version }}
          path: dist

      - name: Recheck checksum and build provenance offline
        env:
          BUNDLE_NAME: ${{ needs.attest.outputs.bundle_name }}
          WHEEL_NAME: ${{ needs.preflight-build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          WHEEL="dist/$WHEEL_NAME"
          BUNDLE="dist/$BUNDLE_NAME"
          test -f "$WHEEL"
          test -s "$BUNDLE"
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          gh attestation verify "$WHEEL" \
            --bundle "$BUNDLE" \
            --deny-self-hosted-runners \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA"

      - name: Create draft, upload assets, then publish by release ID
        env:
          BUNDLE_NAME: ${{ needs.attest.outputs.bundle_name }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight-build.outputs.tag }}
          WHEEL_NAME: ${{ needs.preflight-build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          WHEEL="dist/$WHEEL_NAME"
          BUNDLE="dist/$BUNDLE_NAME"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

          RELEASE_ID=""
          TAG_CREATED=0
          cleanup() {
            if [ -n "$RELEASE_ID" ]; then
              echo "Deleting unpublished draft release $RELEASE_ID" >&2
              if ! gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                --silent; then
                echo "Could not delete draft; retaining its tag for recovery" >&2
                return
              fi
            fi
            if [ "$TAG_CREATED" -eq 1 ]; then
              if ! CURRENT_TAG_SHA="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                  --jq '.object.sha'
              )"; then
                echo "Could not inspect unpublished tag; manual cleanup required" >&2
                return 1
              fi
              if [ "$CURRENT_TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "Refusing to delete unexpected unpublished tag; manual cleanup required" >&2
                return 1
              fi
              echo "Deleting unpublished tag $TAG" >&2
              if ! gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                --silent; then
                echo "Unpublished tag cleanup failed; manual cleanup required" >&2
                return 1
              fi
            fi
          }
          trap cleanup EXIT

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" \
            --silent
          TAG_CREATED=1
          test "$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )" = $'commit\t'"$GITHUB_SHA"

          RELEASE_DETAILS="$(
            gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TAG" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '[.id, (.upload_url | split("{")[0])] | @tsv'
          )"
          IFS=$'\t' read -r RELEASE_ID UPLOAD_URL <<< "$RELEASE_DETAILS"
          case "$RELEASE_ID" in
            ''|*[!0-9]*)
              echo "GitHub did not return a numeric draft release ID" >&2
              exit 1
              ;;
          esac
          case "$UPLOAD_URL" in
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
              ;;
            *)
              echo "GitHub returned an unexpected release upload URL" >&2
              exit 1
              ;;
          esac

          upload_asset() {
            local ASSET="$1"
            local ASSET_LABEL="$2"
            local ASSET_NAME
            ASSET_NAME="$(basename "$ASSET")"
            gh api \
              --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "$ASSET" \
              -f name="$ASSET_NAME" \
              -f label="$ASSET_LABEL" \
              "$UPLOAD_URL" \
              --silent
          }
          upload_asset "$WHEEL" "Python wheel"
          upload_asset "dist/SHA256SUMS" "SHA-256 checksums"
          upload_asset "$BUNDLE" "Offline build provenance"

          test "$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq 'map(.name) | sort | join("\n")'
          )" = "$(
            printf '%s\n' \
              "$(basename "$WHEEL")" \
              "SHA256SUMS" \
              "$(basename "$BUNDLE")" \
              | sort
          )"

          gh api \
            --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true \
            --silent
          trap - EXIT

      - name: Verify immutable release and every published asset
        env:
          BUNDLE_NAME: ${{ needs.attest.outputs.bundle_name }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight-build.outputs.tag }}
          WHEEL_NAME: ${{ needs.preflight-build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          WHEEL="dist/$WHEEL_NAME"
          BUNDLE="dist/$BUNDLE_NAME"

          TAG_TYPE="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.type'
          )"
          TAG_SHA="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha'
          )"
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_TYPE="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" \
                --jq '.object.type'
            )"
            TAG_SHA="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" \
                --jq '.object.sha'
            )"
          fi
          test "$TAG_TYPE" = "commit"
          test "$TAG_SHA" = "$GITHUB_SHA"

          for attempt in $(seq 1 30); do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Release attestation was not available after 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          gh release verify-asset "$TAG" "$WHEEL" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$TAG" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$TAG" "$BUNDLE" --repo "$GITHUB_REPOSITORY"
          test "$(
            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,targetCommitish \
              --jq '[.isDraft, .targetCommitish] | @tsv'
          )" = $'false\t'"$GITHUB_SHA"
