name: Unit Tests

# Added 2026-06-11 after the chunk-merge gap-duplication incident: PR #229
# changed merge semantics and broke 2 tests from PR #227, and nothing
# noticed for two days because no workflow ran the unit suite (only
# retrieval-floor's single file). The suite is Linux-clean (737 passed in
# PR #229's fresh-venv verification; 828 as of this workflow's PR).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify installed wheel contract
        run: python tests/acceptance/wheel_contract.py

      - name: Run unit suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/unit/ -q

      - name: Run MCP contract acceptance
        env:
          CODE_SEARCH_QUERY_HISTORY: "off"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          tests/integration/test_mcp_search_contract.py
          tests/integration/test_mcp_transport_contract.py
          -q
