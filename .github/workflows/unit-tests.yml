name: Merge CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an older PR run. Merge-group and main runs are
  # retained because they are the validation that can actually land or has
  # already landed code.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheel:
    outputs:
      platform_smoke_required: ${{ steps.platform-scope.outputs.required }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine cross-platform smoke scope
        id: platform-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          required=false
          if ! changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
            echo "::warning::Could not resolve the PR diff; retaining the full platform smoke matrix"
            required=true
          else
            while IFS= read -r changed_file; do
              case "$changed_file" in
                *.py|*.json|*.yml|*.yaml|*.toml|*.cfg|*.ini|*.lock|\
                requirements*.txt|Dockerfile*)
                  required=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the single test artifact
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert wheels[0].name.endswith("-py3-none-any.whl"), wheels[0]
          print(wheels[0])
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-search-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-local.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-local.txt

      - name: Ruff correctness baseline
        run: |
          python -m pip install "ruff==0.16.6"
          python -m ruff check .

      - name: Run unit suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/unit/ -q

      - name: Run MCP contract acceptance
        env:
          CODE_SEARCH_QUERY_HISTORY: "off"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          tests/integration/test_mcp_search_contract.py
          tests/integration/test_mcp_transport_contract.py
          -q

  frozen-retrieval:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-local.txt

      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-local.txt

      - name: Run frozen offline retrieval floor
        run: |
          FROZEN_TMP="$(mktemp -d)"
          trap 'rm -rf "$FROZEN_TMP"' EXIT
          python3 bench/eval/build_frozen_model.py --output "$FROZEN_TMP/model"
          CODE_SEARCH_STORAGE="$FROZEN_TMP/storage" \
          PYTHONHASHSEED=0 \
          HF_HUB_OFFLINE=1 \
          TRANSFORMERS_OFFLINE=1 \
          python3 bench/eval/check_retrieval_floor.py \
              --mode index-and-eval \
              --project bench/eval/fixtures/frozen-v1/corpus \
              --gold bench/eval/fixtures/frozen-v1/gold.json \
              --manifest bench/eval/fixtures/frozen-v1/manifest.json \
              --provider local \
              --model "$FROZEN_TMP/model" \
              --floor-semantic-mrr 0.80 \
              --floor-semantic-hr1 0.80 \
              --floor-keyword-mrr 0.80 \
              --floor-keyword-hr1 0.80 \
              --rerank off

      - name: Run full frozen retrieval contract
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          tests/integration/test_frozen_retrieval_contract.py
          -q

  wheel-smoke-linux:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the single test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-search-wheel
          path: dist

      - name: Install acceptance-runner dependencies
        run: python -m pip install pytest PyYAML

      - name: Exercise the built wheel outside the source tree
        shell: bash
        run: |
          WHEEL="$(python -c 'from pathlib import Path; wheels=list(Path("dist").glob("*.whl")); assert len(wheels) == 1, wheels; print(wheels[0])')"
          python tests/acceptance/wheel_contract.py \
            --wheel "$WHEEL" \
            --install-dependencies

  # Cross-platform wheel behavior is load-bearing, but running four hosted
  # platform legs on documentation-only PRs multiplies cost before merge.
  # Keep the full matrix on merge-group/main and packaging/runtime PRs; those
  # lanes are skipped only when the scope check proves no package behavior can
  # have changed.
  wheel-smoke-platform:
    needs: build-wheel
    if: >-
      github.event_name != 'pull_request' ||
      needs.build-wheel.outputs.platform_smoke_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the single test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-search-wheel
          path: dist

      - name: Install acceptance-runner dependencies
        run: python -m pip install pytest PyYAML

      - name: Exercise the built wheel outside the source tree
        shell: bash
        run: |
          WHEEL="$(python -c 'from pathlib import Path; wheels=list(Path("dist").glob("*.whl")); assert len(wheels) == 1, wheels; print(wheels[0])')"
          python tests/acceptance/wheel_contract.py \
            --wheel "$WHEEL" \
            --install-dependencies

  merge-gate:
    name: merge-gate
    if: always()
    needs:
      - build-wheel
      - unit-tests
      - frozen-retrieval
      - wheel-smoke-linux
      - wheel-smoke-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Require every merge lane
        env:
          BUILD_WHEEL_RESULT: ${{ needs.build-wheel.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          FROZEN_RETRIEVAL_RESULT: ${{ needs.frozen-retrieval.result }}
          WHEEL_SMOKE_LINUX_RESULT: ${{ needs.wheel-smoke-linux.result }}
          WHEEL_SMOKE_PLATFORM_RESULT: ${{ needs.wheel-smoke-platform.result }}
        run: |
          for result in \
            "$BUILD_WHEEL_RESULT" \
            "$UNIT_TESTS_RESULT" \
            "$FROZEN_RETRIEVAL_RESULT" \
            "$WHEEL_SMOKE_LINUX_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required merge lane did not succeed: $result" >&2
              exit 1
            fi
          done
          if [ "$WHEEL_SMOKE_PLATFORM_RESULT" != "success" ] && \
             [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Required cross-platform smoke lane did not succeed: $WHEEL_SMOKE_PLATFORM_RESULT" >&2
            exit 1
          fi
