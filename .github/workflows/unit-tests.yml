name: Unit Tests

# Added 2026-06-11 after the chunk-merge gap-duplication incident: PR #229
# changed merge semantics and broke 2 tests from PR #227, and nothing
# noticed for two days because no workflow ran the unit suite (only
# retrieval-floor's single file). The suite is Linux-clean (737 passed in
# PR #229's fresh-venv verification; 828 as of this workflow's PR).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit suite
        run: python -m pytest tests/unit/ -q
