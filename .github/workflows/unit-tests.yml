name: Merge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the single test artifact
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert wheels[0].name.endswith("-py3-none-any.whl"), wheels[0]
          print(wheels[0])
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-search-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/unit/ -q

      - name: Run MCP contract acceptance
        env:
          CODE_SEARCH_QUERY_HISTORY: "off"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          tests/integration/test_mcp_search_contract.py
          tests/integration/test_mcp_transport_contract.py
          -q

  frozen-retrieval:
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run frozen offline retrieval floor
        run: |
          FROZEN_TMP="$(mktemp -d)"
          trap 'rm -rf "$FROZEN_TMP"' EXIT
          python3 bench/eval/build_frozen_model.py --output "$FROZEN_TMP/model"
          CODE_SEARCH_STORAGE="$FROZEN_TMP/storage" \
          PYTHONHASHSEED=0 \
          HF_HUB_OFFLINE=1 \
          TRANSFORMERS_OFFLINE=1 \
          python3 bench/eval/check_retrieval_floor.py \
              --mode index-and-eval \
              --project bench/eval/fixtures/frozen-v1/corpus \
              --gold bench/eval/fixtures/frozen-v1/gold.json \
              --manifest bench/eval/fixtures/frozen-v1/manifest.json \
              --provider local \
              --model "$FROZEN_TMP/model" \
              --floor-semantic-mrr 0.80 \
              --floor-semantic-hr1 0.80 \
              --floor-keyword-mrr 0.80 \
              --floor-keyword-hr1 0.80 \
              --rerank off

      - name: Run full frozen retrieval contract
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          tests/integration/test_frozen_retrieval_contract.py
          -q

  wheel-smoke:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the single test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-search-wheel
          path: dist

      - name: Install acceptance-runner dependencies
        run: python -m pip install pytest PyYAML

      - name: Exercise the built wheel outside the source tree
        shell: bash
        run: |
          WHEEL="$(python -c 'from pathlib import Path; wheels=list(Path("dist").glob("*.whl")); assert len(wheels) == 1, wheels; print(wheels[0])')"
          python tests/acceptance/wheel_contract.py \
            --wheel "$WHEEL" \
            --install-dependencies

  merge-gate:
    name: merge-gate
    if: always()
    needs:
      - build-wheel
      - unit-tests
      - frozen-retrieval
      - wheel-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Require every merge lane
        env:
          BUILD_WHEEL_RESULT: ${{ needs.build-wheel.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          FROZEN_RETRIEVAL_RESULT: ${{ needs.frozen-retrieval.result }}
          WHEEL_SMOKE_RESULT: ${{ needs.wheel-smoke.result }}
        run: |
          for result in \
            "$BUILD_WHEEL_RESULT" \
            "$UNIT_TESTS_RESULT" \
            "$FROZEN_RETRIEVAL_RESULT" \
            "$WHEEL_SMOKE_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required merge lane did not succeed: $result" >&2
              exit 1
            fi
          done
