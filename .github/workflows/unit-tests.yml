name: Unit Tests

# Added 2026-06-11 after the chunk-merge gap-duplication incident: PR #229
# changed merge semantics and broke 2 tests from PR #227, and nothing
# noticed for two days because no workflow ran the unit suite (only
# retrieval-floor's single file). The suite is Linux-clean (737 passed in
# PR #229's fresh-venv verification; 828 as of this workflow's PR).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit suite
        run: python -m pytest tests/unit/ -q
