name: Mirror

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

# Serialize mirror runs per ref so concurrent pushes don't race on the
# personal-fork remote. Without this, two pushes within the same second
# both fetch from the source then both try to push, and the second one
# fails with "cannot lock ref ... is at X but expected Y" because the
# target moved between the second runner's fetch and its push.
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false  # let in-flight finish; queue the next

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push branches and tags to personal account
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          DEST_REPO: redacted-brandyn/${{ github.event.repository.name }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN secret not set. Generate a fine-grained PAT at"
            echo "::error::  https://github.com/settings/personal-access-tokens/new"
            echo "::error::with Contents:Write permission on redacted-brandyn/* repos, then"
            echo "::error::set it as MIRROR_TOKEN secret on this repo."
            exit 1
          fi
          git remote add personal "https://x-access-token:$MIRROR_TOKEN@github.com/$DEST_REPO.git"
          # Mirror semantics: source = truth, target follows. Plain --force is
          # correct (no local lease ref to compare against on the cross-org
          # target). Concurrency group above prevents two runners racing.
          git push personal --all --force
          git push personal --tags --force
