name: Mirror to personal account

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push branches and tags to personal account
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          DEST_REPO: redacted-brandyn/${{ github.event.repository.name }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN secret not set. Generate a fine-grained PAT at"
            echo "::error::  https://github.com/settings/personal-access-tokens/new"
            echo "::error::with Contents:Write permission on redacted-brandyn/* repos, then"
            echo "::error::set it as MIRROR_TOKEN secret on this repo."
            exit 1
          fi
          git remote add personal "https://x-access-token:$MIRROR_TOKEN@github.com/$DEST_REPO.git"
          # Mirror semantics: make the target match the source. Use plain --force,
          # not --force-with-lease — the lease check requires a local ref that
          # tracks the target's history, which we don't have. Without --force,
          # any divergence on the personal repo (including a different HEAD) is
          # rejected. We do NOT use --mirror because that tries to delete the
          # target's HEAD branch, which GitHub refuses.
          git push personal --all --force
          git push personal --tags --force
