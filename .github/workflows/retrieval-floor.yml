name: Retrieval Floor Gate

# Phase α defensive gate for code-search retrieval (2026-05-14 plan
# `2026-05-14-code-search-consolidation-roadmap.md`). Mirrors the
# code-graph adversarial-F1 floor gate (Phase C of grade-lift roadmap).
#
# Scope: catastrophic-regression catch via unit tests of the gate script
# itself. The full PSM eval that the gate parses requires the production
# Voyage index + ~5-10 min wall — too expensive to run per-PR in CI.
# Contributors run the live eval locally before pushing
# (see `bench/eval/README.md`).
#
# Falsifier (per plan): if PSM-fixture cost is too high for CI → scope to
# local-only pre-commit. This workflow lands the script + tests on every
# PR touching retrieval surfaces so regressions to the gate itself are
# caught at merge time.

on:
  pull_request:
    paths:
      - 'mcp_server/**'
      - 'embeddings/**'
      - 'chunking/**'
      - 'search/**'
      - 'fusion/**'
      - 'benchmarks/**'
      - 'bench/eval/**'
      - 'tests/unit/test_check_retrieval_floor.py'
      - '.github/workflows/retrieval-floor.yml'

permissions:
  contents: read

jobs:
  gate-script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run gate-script unit tests
        run: |
          python -m pytest tests/unit/test_check_retrieval_floor.py -v

      - name: Smoke-test gate --help
        run: |
          python bench/eval/check_retrieval_floor.py --help
